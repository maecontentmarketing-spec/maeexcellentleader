        <p class="field-hint">Paste it into ChatGPT, generate your content, then come back and fill in the last field with what you posted.</p>
      </div>`;
    }
  }
  else if(task.submitType === 'photo'){ mainField = `<div class="field"><label class="field-label">Upload photo</label><input type="file" id="task-content" accept="image/*"></div>`; }
  else { mainField = `<div class="field"><label class="field-label">${task.submitType==='link'?'Paste your link':'Your submission'}</label><textarea id="task-content" placeholder="Paste your link or write your submission..."></textarea></div>`; }

  openModal(`
    <div class="modal-title">Submit: ${escapeHtml(task.nameEN)}</div>
    <p class="hint" style="margin-bottom:14px;">${escapeHtml(task.instructions)} (+${task.points}pt)</p>
    ${mainField}
    ${remarksBlock}
    <button class="btn btn-primary btn-block" id="confirm-submit-task-btn">${isAuto?'Submit for instant check':'Submit for Mentor review'}</button>
  `);
  if(isStructured && task.promptTemplate){
    window.__updatePromptPreview = ()=>{
      let out = task.promptTemplate;
      let allFilled = true;
      task.fields.forEach((f,fi)=>{
        const el = document.getElementById(`task-field-${fi}`);
        const v = el ? el.value.trim() : '';
        if(!v) allFilled = false;
        out = out.replaceAll(`{{${f.id}}}`, v || `[${f.label}]`);
      });
      const preview = document.getElementById('prompt-preview');
      if(preview) preview.value = out;
      const copyBtn = document.getElementById('copy-prompt-btn');
      if(copyBtn) copyBtn.disabled = !allFilled;
    };
    window.__updatePromptPreview();
    const copyBtn = document.getElementById('copy-prompt-btn');
    if(copyBtn) copyBtn.addEventListener('click', ()=>{
      const preview = document.getElementById('prompt-preview');
      preview.select();
      document.execCommand('copy');
      toast('Prompt copied \u2014 paste it into ChatGPT');
    });
  }
  document.getElementById('confirm-submit-task-btn').addEventListener('click', ()=>{
    if(task.remarks==='compulsory'){
      const val = document.getElementById('task-remarks').value.trim();
      if(!val){ toast('This task requires remarks before you can submit'); return; }
    }
    if(isStructured){
      for(let fi=0; fi<task.fields.length; fi++){
        const v = document.getElementById(`task-field-${fi}`).value.trim();
        if(!v){ toast(`Please fill in "${task.fields[fi].label}"`); return; }
      }
    }
    const remarksVal = task.remarks && task.remarks !== 'none' ? document.getElementById('task-remarks').value.trim() : '';

    if(isAuto){
      const rawAns = document.getElementById('task-answer').value || '';
      const ans = rawAns.trim().toLowerCase().replace(/\s+/g,'');
      const accepted = task.autoAnswer.map(a=>a.toLowerCase().replace(/\s+/g,''));
      const correct = accepted.includes(ans);
      setTaskStatus(state.currentStudentId, taskId, correct?'approved':'rejected', correct?'':'Answer was not correct, please double-check and resubmit.', remarksVal, rawAns.trim());
      closeModal();
      toast(correct ? `Auto-checked: correct! +${task.points}pt` : 'Auto-checked: not quite right, try again.');
      return;
    }
    if(isStructured){
      const content = task.fields.map((f,fi)=>({ label:f.label, value: document.getElementById(`task-field-${fi}`).value.trim() }));
      setTaskStatus(state.currentStudentId, taskId, 'pending', '', remarksVal, content);
      closeModal();
      toast('Submitted, pending Mentor review');
      return;
    }
    if(task.submitType === 'photo'){
      const fileInput = document.getElementById('task-content');
      const file = fileInput && fileInput.files && fileInput.files[0];
      if(!file){ toast('Please choose a photo'); return; }
      const reader = new FileReader();

      };
      reader.readAsDataURL(file);
      return;
    }
    const contentVal = document.getElementById('task-content').value.trim();
    setTaskStatus(state.currentStudentId, taskId, 'pending', '', remarksVal, contentVal);
    closeModal();
    toast('Submitted, pending Mentor review');
  });
}

function setTaskStatus(sid, tid, status, reason, remarksVal, content){
  const s = getStudent(sid);
  const prevEntry = s.taskStatus[tid];
  const prevRemarks = taskRemarksOf(prevEntry);
  const prevContent = (prevEntry && typeof prevEntry === 'object') ? prevEntry.content : undefined;
  const prevDbId = (prevEntry && typeof prevEntry === 'object') ? prevEntry.dbId : undefined;
  const entry = { status };
  if(status==='rejected') entry.reason = reason || '';
  entry.remarks = remarksVal !== undefined ? remarksVal : prevRemarks;
  entry.content = content !== undefined ? content : prevContent;
  entry.submittedAt = NOW.toISOString();
  entry.dbId = prevDbId;
  s.taskStatus[tid] = entry;
  render();
  syncUpsertTaskSubmission(s, tid, entry);
}
function taskContentOf(entry){ if(entry && typeof entry === 'object') return entry.content; return undefined; }
function handleDeleteSubmission(kind, sid, tid, idx){
  if(!window.confirm('Delete this submission? The student will be able to submit again.')) return;
  const s = getStudent(sid);
  if(kind==='task'){ const prev = s.taskStatus[tid]; delete s.taskStatus[tid]; if(prev && prev.dbId) syncDeleteTaskSubmission(prev.dbId); }
  else if(kind==='seq'){ const steps = s.sequentialProgress[tid]; const prev = steps && steps[idx]; if(steps) steps[idx] = {status:'not_submitted'}; if(prev && prev.dbId) syncDeleteTaskSubmission(prev.dbId); }
  else if(kind==='repeat'){ const log = s.repeatableLog[tid]; const prev = log && log[idx]; if(log) log.splice(idx,1); if(prev && prev.dbId) syncDeleteTaskSubmission(prev.dbId); }
  render();
  toast('Submission deleted');
}
function renderContentPreview(contentVal){
  if(contentVal===undefined || contentVal===null || contentVal==='') return `<div class="remarks-note"><b>Submission</b>No content on record for this entry</div>`;
  if(typeof contentVal === 'object' && contentVal.type==='photo'){
    return `<div class="remarks-note"><b>Submission</b><a href="${contentVal.dataUrl}" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700;">view proof \u2197</a></div>`;
  }
  if(Array.isArray(contentVal)){
    return `<div class="remarks-note"><b>Submission</b>${contentVal.map(f=>`<div style="margin-top:4px;"><b style="color:var(--primary);">${escapeHtml(f.label)}:</b> ${escapeHtml(f.value||'\u2014')}</div>`).join('')}</div>`;
  }
  return `<div class="remarks-note"><b>Submission</b>${escapeHtml(String(contentVal))}</div>`;
}
function setSeqStatus(sid, tid, idx, status, reason, content){
  const s = getStudent(sid);
  const task = findTask(tid);
  const steps = getSeqSteps(s, tid, task);
  const prevContent = steps[idx] ? steps[idx].content : undefined;
  const prevDbId = steps[idx] ? steps[idx].dbId : undefined;
  const entry = { status };
  if(status==='rejected') entry.reason = reason || '';
  entry.content = content !== undefined ? content : prevContent;
  entry.dbId = prevDbId;
  steps[idx] = entry;
  render();
  syncUpsertSeqSubmission(s, tid, task.steps[idx].id, entry);
}

/* ---- Quiz flow ---- */
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function openQuizModal(taskId){
  const task = findTask(taskId);
  const s = currentStudent();
  const at = s.quizAttempts[taskId];
  const isRetake = at && at.canRetake;

  let questions = task.quiz.questions.map((q,qi)=>({ qi, text:q.text, options:q.options.map((opt,oi)=>({ text:opt, correct: oi===q.correct })) }));
  if(isRetake){ questions = shuffle(questions).map(q=>({ ...q, options: shuffle(q.options) })); }
  window.__quizState = { taskId, questions };

  openModal(`
    <div class="modal-title">${escapeHtml(task.nameEN)}</div>
    <div class="quiz-progress">${questions.length} questions \u00b7 ${task.quiz.perQuestion}pt each \u00b7 Submit once, no retakes</div>
    <div id="quiz-questions">
      ${questions.map((q,idx)=>`
        <div class="quiz-q" data-qidx="${idx}">
          <div class="qtext">${idx+1}. ${escapeHtml(q.text)}</div>
          ${q.options.map((o,oi)=>`<label class="quiz-opt"><input type="radio" class="quiz-radio" name="q${idx}" value="${oi}"><span>${escapeHtml(o.text)}</span></label>`).join('')}
        </div>`).join('')}
    </div>
    <button class="btn btn-primary btn-block" data-submit-quiz="${taskId}">Submit Quiz</button>
  `);
}
function handleQuizSubmit(taskId){
  const task = findTask(taskId);
  const qs = window.__quizState.questions;
  let correctCount = 0;
  const container = document.getElementById('quiz-questions');
  qs.forEach((q,idx)=>{
    const checked = container.querySelector(`input[name="q${idx}"]:checked`);
    if(checked){ const oi = parseInt(checked.value,10); if(q.options[oi] && q.options[oi].correct) correctCount++; }
  });
  const score = correctCount * task.quiz.perQuestion;
  const s = currentStudent();
  const prevAt = s.quizAttempts[taskId];
  s.quizAttempts[taskId] = { completed:true, score, correctCount, total:qs.length, canRetake:false, history: (prevAt && prevAt.history) || [], dbId: prevAt && prevAt.dbId, mirrorDbId: prevAt && prevAt.mirrorDbId };
  closeModal();
  render();
  toast(`Submitted! ${correctCount}/${qs.length} correct, +${score}pt`);
  syncQuizResult(s, taskId, s.quizAttempts[taskId]);
}
function handleResetQuiz(sid, tid){
  const s = getStudent(sid);
  const at = s.quizAttempts[tid];
  if(!at) return;
  at.history.push({ score:at.score, date: NOW.toISOString().slice(0,10) });
  at.completed = false; at.score = 0; at.correctCount = 0; at.canRetake = true;
  render();
  toast('Retake allowed, questions will be shuffled, first score will not count');
  syncQuizResult(s, tid, at);
}

async function loadInitialData(){
  try{
    // Task check-in system: CATEGORIES/TASKS are mirrored from Supabase (task_categories/tasks), same
    // "always mirror exactly" policy as everything else below — Admin's Task/Category editor now persists
    // here, so this must load before we reconstruct any per-student task state that depends on TASKS.
    const { data: dbCategories } = await sb.from('task_categories').select('*').order('sort_order', { ascending:true });
    if(dbCategories && dbCategories.length){
      CATEGORIES = dbCategories.map(row=>({
        key: row.key, label: row.label, chain: !!row.chain, unlockType: row.unlock_type || 'points',
        unlockPt: row.unlock_pt || 0, unlockDate: row.unlock_date || '',
      }));
    }
    const { data: dbTasks } = await sb.from('tasks').select('*').order('sort_order', { ascending:true });
    if(dbTasks && dbTasks.length){
      const nextTasks = {};
      CATEGORIES.forEach(c=>{ nextTasks[c.key] = []; });
      dbTasks.forEach(row=>{
        const cfg = row.config || {};
        const task = Object.assign({
          id: row.id, category: row.category_key, nameEN: row.name_en, nameCN: row.name_cn,
          mentor: row.mentor, deadline: row.deadline || '', instructions: row.instructions || '',
          points: row.points || 0, submitType: row.submit_type, remarks: row.remarks || 'none',
          live: !!row.live, tier: row.tier || '', dependsOn: row.depends_on || '',
        }, cfg);
        if(!nextTasks[row.category_key]) nextTasks[row.category_key] = [];
        nextTasks[row.category_key].push(task);
      });
      TASKS = nextTasks;
    }

    const { data: dbStudents, error: sErr } = await sb.from('students').select('*').order('created_at', { ascending:true });
    if(sErr) throw sErr;
    // Always mirror Supabase exactly (even when empty) — no demo/seed fallback, so a fresh Supabase project means a fresh, empty app.
    const { data: dbInvoices } = await sb.from('invoices').select('*');
    const { data: dbTaskSubs } = await sb.from('task_submissions').select('*').order('submitted_at', { ascending:true });
    const { data: dbQuizResults } = await sb.from('quiz_results').select('*');
    const { data: dbVideoLogs } = await sb.from('video_logs').select('*').order('date', { ascending:true });
    state.students = (dbStudents||[]).map(row=>{
      const stu = makeStudent({
        id: row.id, memberId: row.member_id, name: row.name,
        originTeam: row.origin_team, team: mapOriginTeamToColor(row.origin_team),
        tierLabel: row.tier_label, telegramBound: row.telegram_bound,
        celebratedInvoiceIds: row.celebrated_invoice_ids || [],
      });
      stu.invoices = (dbInvoices||[]).filter(inv=>inv.student_id===row.id).map(inv=>({
        id: inv.id, tier: inv.tier, invoiceNo: inv.invoice_no, status: inv.status,
        date: inv.date, approvedAt: inv.approved_at, reason: inv.reason || '',
        hidden: inv.hidden, telegramSent: inv.telegram_sent, customFields: inv.extra_fields || {}, dbSynced:true,
      }));

      // Task submissions: one row per (student,task) for standard types, or one row per (student,task,seq_key)
      // for sequential (seq_key=step id) and repeatable (seq_key=generated per-entry key). Quiz tasks write a
      // simplified mirror row here too (per Amy's confirmed design), but quiz_results stays authoritative for
      // quizAttempts, so quiz rows are skipped here to avoid reconstructing state from the wrong source.
      stu.taskStatus = {}; stu.sequentialProgress = {}; stu.repeatableLog = {};
      (dbTaskSubs||[]).filter(sub=>sub.student_id===row.id).forEach(sub=>{
        const task = findTask(sub.task_id);
        if(!task || task.submitType === 'quiz') return;
        if(task.submitType === 'sequential'){
          if(!stu.sequentialProgress[sub.task_id]) stu.sequentialProgress[sub.task_id] = task.steps.map(()=>({status:'not_submitted'}));
          const stepIdx = task.steps.findIndex(st=>st.id===sub.seq_key);
          if(stepIdx>=0){
            const entry = { status: sub.status };
            if(sub.reason) entry.reason = sub.reason;
            entry.content = sub.payload ? sub.payload.content : undefined;
            entry.dbId = sub.id;
            stu.sequentialProgress[sub.task_id][stepIdx] = entry;
          }
          return;
        }
        if(task.submitType === 'repeatable'){
          if(!stu.repeatableLog[sub.task_id]) stu.repeatableLog[sub.task_id] = [];
          const entry = {
            date: (sub.payload && sub.payload.date) || (sub.submitted_at||'').slice(0,10),
            status: sub.status, note: sub.payload ? sub.payload.note : '',
            dbId: sub.id, entryKey: sub.seq_key,
          };
          if(sub.reason) entry.reason = sub.reason;
          stu.repeatableLog[sub.task_id].push(entry);
          return;
        }
        // Standard types: text / link / photo / structured / auto — one row per (student,task).
        stu.taskStatus[sub.task_id] = {
          status: sub.status, reason: sub.reason || '', remarks: (sub.payload && sub.payload.remarks) || '',
          content: sub.payload ? sub.payload.content : undefined, submittedAt: sub.submitted_at, dbId: sub.id,
        };
      });

      stu.quizAttempts = {};
      (dbQuizResults||[]).filter(qr=>qr.student_id===row.id).forEach(qr=>{
        stu.quizAttempts[qr.quiz_task_id] = {
          completed: !!qr.completed, score: qr.score || 0, correctCount: qr.correct_count || 0,
          total: qr.total || 0, canRetake: !!qr.can_retake, history: qr.history || [], dbId: qr.id,
        };
      });

      stu.videoLogs = (dbVideoLogs||[]).filter(v=>v.student_id===row.id).map(v=>({
        id: v.id, url: v.url, platform: v.platform || 'facebook', postDate: v.post_date || v.date,
        views: v.views, status: v.status, reason: v.reason || '', date: v.date,
        viewsStatus: v.views_status || 'not_submitted', viewsReason: v.views_reason || '', dbSynced:true,
      }));

      return stu;
    });

    const { data: dbSettings } = await sb.from('settings').select('*');
    (dbSettings||[]).forEach(row=>{ state[row.key] = row.value; });

    const { data: dbCheers } = await sb.from('shoutout_cheers').select('*');
    const cheersMap = {};
    (dbCheers||[]).forEach(row=>{
      if(!cheersMap[row.post_id]) cheersMap[row.post_id] = {};
      cheersMap[row.post_id][row.emoji] = row.count;
    });
    state.cheers = cheersMap;

    const { data: dbMyCheers } = await sb.from('shoutout_my_cheers').select('*');
    const myCheersMap = {};
    (dbMyCheers||[]).forEach(row=>{
      if(!myCheersMap[row.student_id]) myCheersMap[row.student_id] = {};
      myCheersMap[row.student_id][row.post_id] = row.emoji;
    });
    state.myCheers = myCheersMap;
  }catch(err){
    console.error('EL002: could not load from Supabase, staying on local/demo data for this session', err);
  }
}

// Quiz: dual-write per Amy's confirmed design — full record in quiz_results (score/history/retake state),
// plus a simplified always-approved mirror row in task_submissions so Admin's "all submissions" overview
// stays complete across every task type.
async function syncQuizResult(s, taskId, at){
  if(!s.id){ console.warn('syncQuizResult: student not synced yet, skipped'); return; }
  try{
    const row = {
      student_id: s.id, quiz_task_id: taskId, score: at.score, completed: !!at.completed,
      correct_count: at.correctCount || 0, total: at.total || 0, can_retake: !!at.canRetake,
      history: at.history || [], attempted_at: new Date().toISOString(),
    };
    if(at.dbId) row.id = at.dbId;
    const { data, error } = await sb.from('quiz_results').upsert(row).select().single();
    if(error){ console.error('syncQuizResult failed', error); return; }
    if(data && data.id) at.dbId = data.id;

    const mirrorRow = {
      student_id: s.id, task_id: taskId, status:'approved',
      payload: { score: at.score, correctCount: at.correctCount, total: at.total },
      submitted_at: new Date().toISOString(), approved_at: new Date().toISOString(),
    };
    if(at.mirrorDbId) mirrorRow.id = at.mirrorDbId;
    const { data: mdata, error: merr } = await sb.from('task_submissions').upsert(mirrorRow).select().single();
    if(merr){ console.error('syncQuizResult mirror failed', merr); return; }
    if(mdata && mdata.id) at.mirrorDbId = mdata.id;
  }catch(err){ console.error('syncQuizResult failed', err); }
}

}

async function fetchCotConnectorRanking(){
  if(!sbCot) return { ranking: [], unmatched: [], connected:false };
  try{
    const { data, error } = await sbCot.from('cot_connector_counts').select('*');
    if(error) throw error;
    const matched = [], unmatched = [];
    (data||[]).forEach(r=>{
      const code = String(r.agent_code||'').toUpperCase();
      const stu = state.students.find(x=>x.memberId.toUpperCase()===code);
      if(stu) matched.push({ id: stu.id, name: stu.name, team: stu.team, leadCount: r.lead_count });
      else if(code !== 'KATE') unmatched.push({ agentCode: code, leadCount: r.lead_count });
    });
    matched.sort((a,b)=>b.leadCount-a.leadCount);
    return { ranking: matched.slice(0,3), unmatched, connected:true };
  }catch(err){
    console.error('fetchCotConnectorRanking failed', err);
    return { ranking: [], unmatched: [], connected:false };
  }
}
