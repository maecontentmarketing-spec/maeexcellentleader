<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Excellent Leader 002 · Recruitment Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#500088;
  --primary-dark:#3A0066;
  --accent:#7350B5;
  --gold:#C9A34E;
  --gold-light:#F3E7C9;
  --bg-light:#F3EEFA;
  --line:#E4D9F2;
  --red:#E0475A;
  --red-light:#FCE9EC;
  --yellow:#E8A63A;
  --yellow-light:#FDF1DD;
  --black:#22202E;
  --black-light:#EAE9EE;
  --white:#FFFFFF;
  --ink:#241B33;
  --ink-soft:#6B5E82;
  --success:#2FAE66;
  --success-bg:#E4F6EC;
  --danger:#E0475A;
  --danger-bg:#FCE9EB;
  --warn:#E8A63A;
  --warn-bg:#FCF1E0;
  --font-display:'DM Sans',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Sans',sans-serif;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-sm:0 2px 10px rgba(58,0,102,0.08);
  --shadow-md:0 10px 30px rgba(58,0,102,0.16);
  --nav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg-light);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
::selection{background:var(--accent);color:#fff;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;}
a{color:inherit;}
img{max-width:100%;display:block;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}

#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg-light);position:relative;padding-bottom:calc(var(--nav-h) + 18px);}
@media(min-width:521px){ #app{box-shadow:0 0 60px rgba(58,0,102,0.12);} }

.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(58,0,102,0.25);}
.topbar .brand-logo{height:32px;width:auto;display:block;}
.role-switch{display:flex;background:#EFE9F7;border-radius:12px;padding:3px;font-size:11.5px;font-weight:600;}
.role-switch-row{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px 10px;}
#auth-status-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:11px;color:var(--ink-soft);background:#fff;border-bottom:1px solid var(--line);}
#auth-status-bar button{font-size:11px;font-weight:700;color:var(--primary);border:1px solid var(--primary);border-radius:999px;padding:4px 12px;}
#auth-status-bar:empty{display:none;}
.login-screen{max-width:420px;margin:0 auto;padding:24px 20px;}
.login-banner{width:100%;border-radius:16px;display:block;box-shadow:0 6px 20px rgba(58,0,102,0.15);}
.login-error{color:var(--danger);font-size:12px;font-weight:700;min-height:16px;margin:6px 0;}
.lookup-readonly-badge{background:var(--gold-light);color:#8A6D1F;font-size:11.5px;font-weight:700;text-align:center;padding:8px;border-radius:10px;margin:12px 0;}
.lookup-search-results{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.lookup-search-item{display:flex;justify-content:space-between;width:100%;padding:10px 12px;font-size:13px;font-weight:600;text-align:left;border-bottom:1px solid var(--line);}
.lookup-search-item:last-child{border-bottom:none;}
.lookup-search-item span{font-weight:400;color:var(--ink-soft);font-size:11.5px;}
.lookup-search-item:hover{background:var(--bg-light);}
.lookup-search-item.highlighted{background:var(--bg-light);}
.lookup-selected-chip{margin-top:10px;background:var(--bg-light);border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;}
.lookup-selected-chip button{color:var(--danger);font-weight:700;}
.role-switch button{flex:1;padding:9px 6px;border-radius:9px;color:var(--ink-soft);opacity:1;transition:all .2s;}
.role-switch button.active{background:#fff;color:var(--primary-dark);box-shadow:0 2px 6px rgba(58,0,102,0.12);}

main{padding:16px 16px 8px;}

.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:var(--nav-h);background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;box-shadow:0 -6px 20px rgba(58,0,102,0.08);overflow-x:auto;}
.bottom-nav button{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:9.5px;font-weight:600;transition:color .15s;padding:0 4px;}
.bottom-nav button .ic{font-size:18px;line-height:1;filter:grayscale(0.3);opacity:.6;}
.bottom-nav button .ic-featured{font-size:26px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg-light);border:1.5px solid var(--line);}
.bottom-nav button.active .ic-featured{background:rgba(80,0,136,0.12);border-color:var(--primary);}
.bottom-nav button.active{color:var(--primary);}
.bottom-nav button.active .ic{opacity:1;filter:none;}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);}
.section-title{font-family:var(--font-display);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;color:var(--primary-dark);}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title:first-child{margin-top:4px;}
.section-title .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-weight:700;display:block;margin-bottom:3px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.badge.approved{background:var(--success-bg);color:var(--success);}
.badge.pending{background:var(--warn-bg);color:#B87816;}
.badge.rejected{background:var(--danger-bg);color:var(--danger);}
.badge.muted{background:#F0EDF6;color:var(--ink-soft);}
.badge.draft{background:#FCE9EB;color:var(--danger);}
.badge.team-red{background:#FCE9EC;color:var(--red);}
.badge.team-yellow{background:#FDF1DD;color:#A46B15;}
.badge.team-black{background:#EAE9EE;color:var(--black);}
.badge.quiz{background:#EDE7FB;color:var(--primary);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;transition:transform .12s, box-shadow .12s;font-family:var(--font-body);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(80,0,136,0.28);}
.btn-ghost{background:#F0EDF6;color:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--line);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;}
.btn-xs{padding:5px 9px;font-size:11px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.4;pointer-events:none;}
.icon-btn{width:30px;height:30px;border-radius:9px;background:#F0EDF6;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}

input[type=text],input[type=number],input[type=file],input[type=datetime-local],select,textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);font-family:var(--font-body);font-size:13.5px;background:#fff;color:var(--ink);}
textarea{resize:vertical;min-height:70px;}
label.field-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:block;}
label.field-label .req{color:var(--danger);}
.field{margin-bottom:14px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
.check-inline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.check-inline input{width:16px;height:16px;accent-color:var(--primary);}

.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;background:#ddd;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.team-red-bg{background:linear-gradient(135deg,#E0475A,#c23349);}
.team-yellow-bg{background:linear-gradient(135deg,#E8A63A,#c8862a);}
.team-black-bg{background:linear-gradient(135deg,#3d3a4d,#22202E);}

.progress-track{height:9px;border-radius:99px;background:#EFE9F7;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--primary));}

.empty-state{text-align:center;padding:36px 14px;color:var(--ink-soft);}
.empty-state .ic{font-size:32px;margin-bottom:8px;}
.empty-state p{font-size:13px;line-height:1.6;}

/* Quest path */
.quest-wrap{background:linear-gradient(160deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:var(--radius-lg);padding:20px 16px 24px;color:#fff;position:relative;overflow:hidden;}
.quest-wrap::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.10),transparent 70%);}
.quest-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.quest-header .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.7;font-weight:700;}
.quest-header .pts{font-family:var(--font-mono);font-size:30px;font-weight:700;margin-top:3px;}
.quest-header .pts span{font-size:13px;font-family:var(--font-body);font-weight:600;opacity:0.7;}
.quest-next-line{font-size:12px;font-weight:600;opacity:0.9;margin-bottom:16px;background:rgba(255,255,255,0.12);border-radius:10px;padding:8px 12px;}

.avatar-upload-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.avatar-upload-btn{position:relative;}
.avatar-upload-btn .edit-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;box-shadow:0 2px 6px rgba(0,0,0,0.25);}
.avatar-upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.avatar-picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px;}
.avatar-swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.avatar-swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
.avatar-swatch.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(80,0,136,0.2);}
.avatar-picker-grid button{border-radius:14px;overflow:hidden;border:2px solid var(--line);padding:4px;background:#fff;aspect-ratio:1;}
.avatar-picker-grid button.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(80,0,136,0.15);}
.avatar-picker-grid img{width:100%;height:100%;border-radius:10px;}

.quest-track{position:relative;height:64px;margin:0 4px;}
.quest-line{position:absolute;top:19px;left:14px;right:14px;height:4px;background:rgba(255,255,255,0.22);border-radius:4px;}
.quest-line-fill{position:absolute;top:0;left:0;height:100%;background:#fff;border-radius:4px;transition:width .4s;}
.quest-stations{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;}
.quest-station{display:flex;flex-direction:column;align-items:center;width:44px;}
.quest-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);margin-top:11px;}
.quest-dot.done{background:#fff;border-color:#fff;}
.quest-dot.now{background:var(--yellow);border-color:#fff;box-shadow:0 0 0 5px rgba(232,166,58,0.35);}
.quest-label{font-size:9.5px;font-weight:700;margin-top:8px;text-align:center;opacity:0.85;line-height:1.3;}
.quest-marker{position:absolute;top:19px;width:26px;height:26px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(232,166,58,0.3);transition:left .5s cubic-bezier(.4,1.4,.6,1);font-size:14px;}

.ring-wrap{position:relative;width:64px;height:64px;border-radius:50%;flex-shrink:0;}
.ring-hole{position:absolute;inset:7px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-hole .rn{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--primary);}
.ring-hole .rd{font-size:8px;color:var(--ink-soft);}

.next-action-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFF9EC,#FDF1DD);border:1.5px solid var(--gold-light);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;}
.next-action-card .na-ic{width:38px;height:38px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.next-action-card .na-body{flex:1;min-width:0;}
.next-action-card .na-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:#A47A1D;font-weight:800;}
.next-action-card .na-title{font-size:13px;font-weight:700;margin-top:2px;}

.team-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.team-progress-row:last-child{margin-bottom:0;}
.team-progress-row .tname{width:64px;font-size:12px;font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.team-progress-row .bar{flex:1;}
.team-progress-row .pct{width:36px;text-align:right;font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--ink-soft);}

/* Race track (stepping stones) */
.race-lane{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.race-lane:last-child{margin-bottom:0;}
.race-lane .rl-label{width:58px;flex-shrink:0;}
.race-lane .rl-label .tn{font-size:12.5px;font-weight:700;}
.race-lane .rl-label .ts{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--primary);}
.race-track-lane{position:relative;flex:1;height:36px;}
.race-track-line{position:absolute;top:50%;left:0;right:30px;height:2px;background:var(--line);transform:translateY(-50%);}
.race-track-stones{position:absolute;top:50%;left:0;right:30px;display:flex;justify-content:space-between;transform:translateY(-50%);}
.race-track-stones span{width:6px;height:6px;border-radius:50%;background:var(--line);}
.race-token{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.18);transition:left .5s cubic-bezier(.3,1.5,.5,1);}
.race-flag{position:absolute;top:50%;right:0;transform:translateY(-50%);font-size:20px;}
.race-chase-hint{position:relative;font-size:13px;font-weight:700;color:#fff;background:var(--primary);border-radius:14px;padding:12px 16px;margin:16px 8px 6px;text-align:center;box-shadow:0 4px 14px rgba(80,0,136,0.25);}
.race-chase-hint b{color:var(--gold);}
.race-chase-hint::before{content:'';position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:10px solid var(--primary);}
.race-title-eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--primary-dark);font-weight:800;display:block;margin-bottom:3px;}
.wheel-wrap{margin:20px 0;}
.podium-card{padding:20px 12px 0;}
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:6px;}
.podium-slot{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
.podium-crown{font-size:20px;margin-bottom:2px;}
.podium-name{font-size:11.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.podium-team{font-size:9.5px;color:var(--ink-soft);margin-top:1px;}
.podium-value{font-size:13.5px;font-weight:800;color:var(--primary);margin-top:3px;}
.podium-value span{font-size:9px;font-weight:600;color:var(--ink-soft);margin-left:2px;}
.podium-empty{font-size:20px;color:var(--ink-soft);margin-bottom:6px;}
.podium-bar{width:100%;border-radius:10px 10px 0 0;margin-top:10px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-weight:800;font-size:13px;color:#fff;}
.podium-bar.rank-1{height:64px;background:linear-gradient(180deg,#F3C34E,#D9A62A);}
.podium-bar.rank-2{height:46px;background:linear-gradient(180deg,#C9CDD6,#A6ABB6);}
.podium-bar.rank-3{height:34px;background:linear-gradient(180deg,#E0A972,#C08348);}
.library-folder-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.library-folder-cover{width:100%;aspect-ratio:1.6/1;border-radius:10px;background-size:cover;background-position:center;background-color:var(--bg-light);margin-bottom:8px;}
.library-folder-adminbar{display:flex;gap:5px;justify-content:flex-end;margin-bottom:6px;}
.library-folder-adminbar .icon-btn{width:24px;height:24px;font-size:11px;}
.library-folder-card{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 10px;text-align:left;box-shadow:0 4px 14px rgba(58,0,102,0.06);}
.library-folder-delete{position:absolute;top:6px;right:6px;width:24px;height:24px;font-size:11px;}
.library-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.library-item{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(58,0,102,0.08);aspect-ratio:1/1;}
.library-item img{width:100%;height:100%;object-fit:cover;display:block;}
.library-item-pdf-thumb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg-light);font-size:34px;color:#B0413E;}
.library-item-pdf-thumb span{font-size:10.5px;color:var(--ink-soft);font-weight:700;padding:0 8px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.library-item-delete{position:absolute;top:6px;right:6px;width:26px;height:26px;font-size:12px;background:rgba(255,255,255,0.9);}

/* Podium removed in favor of race track, kept styles for compatibility */
.podium{display:flex;align-items:flex-end;gap:8px;margin-bottom:6px;padding:0 4px;}

/* Task / timeline cards */
.category-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
.category-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.category-head-chain{margin-bottom:0;}
.chain-card{width:100%;text-align:left;border-radius:var(--radius-lg);padding:16px 18px;background:#fff;border:1.5px solid var(--line);}
.chain-card h3{font-size:15px;font-weight:700;}
.chain-card.active{border-color:var(--accent);box-shadow:0 4px 16px rgba(115,80,181,0.15);}
.chain-card.done{opacity:0.85;}
.chain-card.locked{opacity:0.55;pointer-events:none;}
.chain-card .lock-ic{font-size:16px;font-style:normal;color:var(--ink-soft);}
.chain-connector{display:flex;justify-content:center;padding:6px 0;}
.chain-connector::before{content:'';width:0;height:26px;border-left:2px dashed var(--line);}
.chain-tasklist{padding:14px 4px 6px;}
.locked-dep{opacity:0.6;}
.repeat-log{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;}
.folder-card{width:100%;display:block;text-align:left;position:relative;border-radius:8px;padding:34px 20px 16px;margin-bottom:18px;box-shadow:0 4px 14px rgba(58,0,102,0.12);clip-path:polygon(0% 20%, 30% 20%, 34% 4%, 100% 4%, 100% 100%, 0% 100%);}
.folder-card.locked{padding:26px 20px 22px;opacity:0.75;pointer-events:none;}
.folder-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.folder-card.locked .folder-top{margin-bottom:0;}
.folder-ic-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.folder-name{font-weight:600;font-size:14px;margin:0;flex:1;}
.folder-anytime-pill{font-size:10px;font-weight:700;color:#8A6D1F;background:#F3E7C9;padding:3px 8px;border-radius:6px;flex-shrink:0;}
.folder-track{height:5px;border-radius:3px;overflow:hidden;margin-bottom:4px;}
.folder-track-fill{height:100%;}
.folder-sub{font-size:11px;margin:0;}
.folder-locked-body{display:flex;flex-direction:column;}
.task-card.flagged{border-color:var(--danger);background:var(--danger-bg);}
.task-card{border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 15px;margin-bottom:10px;background:#fff;}
.task-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.task-card-top h4{font-size:13.5px;font-weight:700;line-height:1.4;}
.task-pts{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;}
.pt-badge{display:inline-flex;align-items:center;gap:4px;background:var(--gold-light);color:#8A6D1F;font-family:var(--font-mono);font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pt-badge .star{color:var(--gold);font-size:11px;}
.pt-badge.lg{font-size:14px;padding:6px 13px;}
.task-desc{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-bottom:10px;}
.reject-note{background:var(--danger-bg);color:var(--danger);font-size:11.5px;border-radius:9px;padding:8px 10px;margin-top:8px;line-height:1.5;}
.reject-note b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;}
.remarks-note{background:var(--bg-light);color:var(--ink-soft);font-size:11.5px;border-radius:9px;padding:8px 10px;margin-top:8px;line-height:1.5;}
.remarks-note b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;color:var(--primary);}

.week-lock-banner{border-radius:var(--radius-md);padding:16px;text-align:center;background:#fff;border:1.5px dashed var(--line);color:var(--ink-soft);margin-bottom:14px;}
.week-lock-banner .ic{font-size:22px;margin-bottom:6px;}
.week-lock-banner b{color:var(--primary-dark);}

.timeline-poster{width:100%;border-radius:var(--radius-lg);margin-bottom:18px;overflow:hidden;border:1px solid var(--line);}
.timeline-poster img{width:100%;display:block;}
.timeline-poster-empty{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:26px 18px;text-align:center;border-radius:var(--radius-lg);margin-bottom:18px;}
.timeline-poster-empty .ic{font-size:26px;margin-bottom:8px;}

.timeline-card{display:flex;gap:12px;border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;background:#fff;}
.timeline-card .tl-dot{width:38px;height:38px;border-radius:11px;background:var(--bg-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.timeline-card.locked .tl-dot{background:#F0EDF6;}
.timeline-card .tl-body{flex:1;min-width:0;}
.timeline-card h4{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.timeline-card .meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}

/* Shoutouts (Today's Shoutouts) */
.announce-card{border-radius:var(--radius-md);padding:14px;margin-bottom:10px;border:1px solid transparent;}
.announce-card.sc-red{background:var(--red-light);border-color:#f5c6cd;}
.announce-card.sc-yellow{background:var(--yellow-light);border-color:#f2d9a8;}
.announce-card.sc-black{background:var(--black-light);border-color:#cfcdd6;}
.announce-top{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.announce-top .txt{flex:1;min-width:0;}
.announce-top .txt .name{font-weight:700;font-size:13.5px;}
.announce-top .txt .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.cheer-row{display:flex;gap:6px;}
.cheer-btn{border:1.5px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.7);border-radius:999px;padding:5px 10px;font-size:12.5px;display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ink-soft);transition:all .15s;}
.cheer-btn .cnt{font-family:var(--font-mono);font-size:11px;}
.cheer-btn.mine{background:#fff;border-color:var(--accent);color:var(--primary);}

/* Reward */
.reward-card{display:flex;gap:12px;border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;background:#fff;align-items:center;}
.reward-card .rw-ic{width:44px;height:44px;border-radius:12px;background:var(--bg-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.reward-card.locked .rw-ic{background:#F0EDF6;filter:grayscale(1);}
.reward-card .rw-body{flex:1;min-width:0;}
.reward-card h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.reward-card .rw-sub{font-size:11px;color:var(--ink-soft);}

/* Tabs (segment) */
.segment{display:flex;background:#EFE9F7;border-radius:12px;padding:3px;margin-bottom:16px;overflow-x:auto;}
.segment button{flex:1;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.segment button.active{background:#fff;color:var(--primary-dark);box-shadow:0 2px 6px rgba(58,0,102,0.12);}

/* Admin review rows */
.review-item{border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;background:#fff;}
.review-item .ri-top{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.review-item .ri-name{font-weight:700;font-size:13px;}
.review-item .ri-meta{font-size:11px;color:var(--ink-soft);}
.review-item .ri-content{font-size:12.5px;background:var(--bg-light);border-radius:9px;padding:9px 11px;margin:8px 0;line-height:1.6;color:var(--ink);}
.review-actions{display:flex;gap:8px;margin-top:10px;}
.review-actions .btn{flex:1;}

.stu-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.stu-row:last-child{border-bottom:none;}
.stu-row .rank-num{width:20px;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--ink-soft);flex-shrink:0;}
.stu-row .stu-info{flex:1;min-width:0;}
.stu-row .stu-info .n{font-weight:700;font-size:13px;}
.stu-row .stu-info .m{font-size:10.5px;color:var(--ink-soft);}
.stu-row .stu-pts{text-align:right;flex-shrink:0;}
.stu-row .stu-pts .p{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--primary);}
.stu-row .stu-pts .s{font-size:10px;color:var(--ink-soft);}

.stu-row.me-row{background:linear-gradient(135deg,#F3EEFA,#EDE4F9);margin:4px -10px;padding:16px 10px;border-radius:16px;border:1.5px solid var(--accent);}
.stu-row.me-row .rank-num{width:26px;font-size:16px;}
.stu-row.me-row .stu-info .n{font-size:15px;}
.stu-row.me-row .avatar{width:44px !important;height:44px !important;font-size:14px !important;}
.stu-row.me-row .stu-pts .p{font-size:17px;}
.me-divider{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--ink-soft);font-size:10.5px;font-weight:700;}
.me-divider::before,.me-divider::after{content:'';flex:1;height:1px;background:var(--line);}

/* Quiz */
.quiz-progress{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-bottom:14px;}
.quiz-q{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.quiz-q .qtext{font-size:13.5px;font-weight:700;margin-bottom:10px;line-height:1.5;}
.quiz-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);margin-bottom:7px;font-size:12.5px;cursor:pointer;}
.quiz-opt input{accent-color:var(--primary);width:15px;height:15px;}
.quiz-opt.checked{border-color:var(--primary);background:var(--bg-light);}

/* Sequential steps */
.seq-step{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.seq-step.locked{opacity:0.5;}
.seq-step .ss-top{display:flex;justify-content:space-between;align-items:center;}
.seq-step .ss-title{font-size:13px;font-weight:700;}
.seq-step .ss-pts{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:700;}
.seq-step .ss-desc{font-size:11.5px;color:var(--ink-soft);margin:4px 0 8px;line-height:1.5;}

/* Task form (admin) */
.qbuild-row{border:1.5px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.qbuild-row .qb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.qbuild-row .qb-top b{font-size:12px;color:var(--primary-dark);}
.qbuild-opt-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.qbuild-opt-row input[type=radio]{accent-color:var(--primary);width:16px;height:16px;flex-shrink:0;}
.qbuild-opt-row input[type=text]{flex:1;}
.answer-chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.answer-chip{background:var(--bg-light);color:var(--primary-dark);font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:99px;display:flex;align-items:center;gap:5px;}
.answer-chip button{color:var(--danger);font-weight:800;}

.task-row-admin{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;background:#fff;}
.task-row-admin .tr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.task-row-admin .tr-name{font-weight:700;font-size:13px;}
.task-row-admin .tr-name .cn{font-weight:500;color:var(--ink-soft);font-size:11px;}
.task-row-admin .tr-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.task-row-admin .tr-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.order-arrows{display:flex;flex-direction:column;gap:2px;}
.order-arrows button{width:20px;height:16px;font-size:9px;color:var(--ink-soft);background:#F0EDF6;border-radius:4px;}

/* Celebration card v2 */
.celebrate-overlay{position:fixed;inset:0;background:rgba(36,27,51,0.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.celebrate-card{background:#fff;border-radius:26px;max-width:360px;width:100%;box-shadow:0 24px 70px rgba(58,0,102,0.35);position:relative;overflow:visible;border:1px solid var(--line);}
.celebrate-lang{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
.celebrate-lang-btns{display:flex;background:var(--bg-light);border-radius:999px;padding:3px;gap:2px;}
.celebrate-lang button{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;color:var(--ink-soft);}
.celebrate-lang button.active{background:var(--primary);color:#fff;}
.celebrate-medal{position:relative;padding-top:34px;display:flex;justify-content:center;}
.celebrate-medal .glow{position:absolute;top:14px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(115,80,181,0.25),transparent 70%);}
.celebrate-medal .wing{position:absolute;top:44px;font-size:26px;opacity:0.55;}
.celebrate-medal .wing.left{left:calc(50% - 78px);transform:scaleX(-1) rotate(-8deg);}
.celebrate-medal .wing.right{right:calc(50% - 78px);transform:rotate(8deg);}
.celebrate-avatar-ring{width:84px;height:84px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--gold),var(--accent));position:relative;z-index:1;}
.celebrate-avatar{width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:26px;color:#fff;border:3px solid #fff;}
.celebrate-avatar img{width:100%;height:100%;object-fit:cover;}
.celebrate-ribbon{display:flex;justify-content:center;gap:2px;margin-top:-3px;position:relative;z-index:0;}
.celebrate-ribbon .tail{width:16px;height:22px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);}
.celebrate-ribbon .tail.l{transform:rotate(4deg);}
.celebrate-ribbon .tail.r{background:var(--primary);transform:rotate(-4deg);}
.celebrate-body{padding:14px 26px 22px;text-align:center;}
.celebrate-body .kicker{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:6px;}
.celebrate-body h2{font-size:19px;color:var(--primary-dark);margin-bottom:8px;line-height:1.3;}
.celebrate-body .msg{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px;}
.celebrate-meta-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;}
.celebrate-pts-pill{background:var(--gold-light);color:#8A6D1F;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;}
.celebrate-date-pill{font-size:11px;color:var(--ink-soft);}
.celebrate-actions{display:flex;gap:8px;}
.confetti{position:absolute;top:-10px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(420px) rotate(400deg);opacity:0;}}

.mycard-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;background:#fff;}
.mycard-item .mc-thumb{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;}
.mycard-item .mc-body{flex:1;min-width:0;}
.mycard-item .mc-title{font-size:13px;font-weight:700;}
.mycard-item .mc-sub{font-size:11px;color:var(--ink-soft);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(36,27,51,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;backdrop-filter:blur(2px);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px 26px;max-height:88vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.3,1,.4,1);}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 16px;}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:16.5px;margin-bottom:14px;}

/* Toast */
#toast-root{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:480px;pointer-events:none;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.25);text-align:center;animation:toastIn .25s;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.hint{font-size:11px;color:var(--ink-soft);line-height:1.6;margin-top:6px;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.stack-sm > * + *{margin-top:8px;}
.tabbed-card-list .card-tier-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;}
.card-tier-tabs button{flex-shrink:0;padding:8px 12px;border-radius:10px;background:#F0EDF6;color:var(--ink-soft);font-size:11.5px;font-weight:700;}
.card-tier-tabs button.active{background:var(--primary);color:#fff;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--primary);margin-bottom:14px;}
</style>
</head>

function getSeqSteps(student, taskId, task){
  if(!student.sequentialProgress[taskId]){
    student.sequentialProgress[taskId] = task.steps.map(()=>({status:'not_submitted'}));
  }
  return student.sequentialProgress[taskId];
}
function seqEarnedPoints(student, task){
  const steps = student.sequentialProgress[task.id];
  if(!steps) return 0;
  let sum = 0;
  task.steps.forEach((s,i)=>{ if(steps[i] && taskStatusOf(steps[i])==='approved') sum += s.points; });
  return sum;
}

function approvedTaskPoints(student){
  let sum = 0;
  for(const cat of Object.keys(TASKS)){
    for(const t of TASKS[cat]){
      if(!t.live) continue;
      if(t.submitType === 'quiz'){
        const at = student.quizAttempts[t.id];
        if(at && at.completed) sum += at.score;
        continue;
      }
      if(t.submitType === 'sequential'){
        sum += seqEarnedPoints(student, t);
        continue;
      }
      if(t.submitType === 'repeatable'){
        sum += repeatableEarnedPoints(student, t);
        continue;
      }
      if(taskStatusOf(student.taskStatus[t.id]) === 'approved') sum += t.points;
    }
  }
  if(student.avatarBonusClaimed) sum += AVATAR_BONUS_PT;
  return sum;
}
function repeatableEarnedPoints(student, task){
  const log = student.repeatableLog[task.id];
  if(!log) return 0;
  return log.filter(e=>e.status==='approved').length * task.points;
}
function getWeekStart(d){

  dt.setDate(dt.getDate() - day);
  return dt;
}
function repeatableWeekCount(student, task){

  if(!log) return 0;
  const weekStart = getWeekStart(NOW);
  return log.filter(e=>new Date(e.date) >= weekStart).length;
}
// ---- Category unlock / chain logic ----
function isTaskFullyDone(student, task){
  if(!task.live) return true;
  if(task.submitType==='quiz'){ const at = student.quizAttempts[task.id]; return !!(at && at.completed); }
  if(task.submitType==='sequential'){ const steps = student.sequentialProgress[task.id]; if(!steps) return false; return task.steps.every((s,i)=>steps[i] && taskStatusOf(steps[i])==='approved'); }
  if(task.submitType==='repeatable'){ const log = student.repeatableLog[task.id]; return !!(log && log.some(e=>e.status==='approved')); }
  return taskStatusOf(student.taskStatus[task.id])==='approved';
}
function categoryAllTasksApproved(catKey, student){
  const tasks = (TASKS[catKey]||[]).filter(t=>t.live);
  if(!tasks.length) return true;
  return tasks.every(t=>isTaskFullyDone(student, t));
}
function categoryUnlocked(cat, student){
  if(cat.unlockType==='points') return totalPoints(student) >= cat.unlockPt;
  if(cat.unlockType==='date') return cat.unlockDate ? NOW >= new Date(cat.unlockDate) : true;
  if(cat.unlockType==='previous'){
    const chain = CATEGORIES.filter(c=>c.chain);
    const idx = chain.findIndex(c=>c.key===cat.key);
    if(idx<=0) return true;
    return categoryAllTasksApproved(chain[idx-1].key, student);
  }
  return true;
}
function categoryLockedReason(cat){
  if(cat.unlockType==='points') return `Unlocks at ${cat.unlockPt}pt`;
  if(cat.unlockType==='date') return cat.unlockDate ? `Unlocks on ${new Date(cat.unlockDate).toLocaleDateString()}` : 'Locked';
  if(cat.unlockType==='previous'){
    const chain = CATEGORIES.filter(c=>c.chain);
    const idx = chain.findIndex(c=>c.key===cat.key);
    const prev = idx>0 ? chain[idx-1] : null;
    return prev ? `Finish "${prev.label}" to unlock` : 'Locked';
  }
  return 'Locked';
}

/* ---- Folder color ramp (auto-scales as categories are added/removed) ---- */
function hexToRgb(hex){ hex = hex.replace('#',''); return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function rgbToHex(rgb){ return '#' + rgb.map(c=>Math.round(Math.max(0,Math.min(255,c))).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function hexLerp(c0, c1, t){ const a = hexToRgb(c0), b = hexToRgb(c1); return rgbToHex([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]); }
function purpleRamp(n){
  const light='#F3EEFA', mid='#7350B5', dark='#3A0066';
  if(n<=1) return [light];
  const out=[];
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    out.push(t<=0.5 ? hexLerp(light, mid, t/0.5) : hexLerp(mid, dark, (t-0.5)/0.5));
  }
  return out;
}
function relativeLuminance(hex){ const [r,g,b] = hexToRgb(hex).map(c=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }); return 0.2126*r+0.7152*g+0.0722*b; }
function textColorFor(bgHex){ return relativeLuminance(bgHex) > 0.5 ? '#3A0066' : '#FFFFFF'; }
function folderIconSvg(color){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`; }
function computeTrackMarkerPct(pts, stations){
  const n = stations.length;
  if(pts <= stations[0].th) return 0;
  for(let i=0;i<n-1;i++){
    const a = stations[i], b = stations[i+1];
    if(pts <= b.th){
      const posA = i/(n-1)*100, posB = (i+1)/(n-1)*100;
      if(b.th===a.th) return posA;
      const frac = (pts-a.th)/(b.th-a.th);
      return posA + frac*(posB-posA);
    }
  }
  return 100;
}

let __sbvChartInstance = null;
function renderPackagesScatterChart(){
  const canvas = document.getElementById('packages-scatter');
  if(!canvas || typeof Chart === 'undefined') return;
  const points = state.students.map(s=>({ x: totalPoints(s), y: approvedSets(s) }));
  if(!points.length) return;
  const n = points.length;
  const sumX = points.reduce((a,p)=>a+p.x,0), sumY = points.reduce((a,p)=>a+p.y,0);
  const sumXY = points.reduce((a,p)=>a+p.x*p.y,0), sumX2 = points.reduce((a,p)=>a+p.x*p.x,0);
  const denom = (n*sumX2 - sumX*sumX);
  const slope = denom ? (n*sumXY - sumX*sumY) / denom : 0;
  const intercept = (sumY - slope*sumX) / n;
  const trend = [ {x:0, y:intercept}, {x:600, y:intercept + slope*600} ];
  if(__sbvChartInstance) __sbvChartInstance.destroy();
  __sbvChartInstance = new Chart(canvas, {
    data: {
      datasets: [
        { type:'scatter', data:points, backgroundColor:'rgba(80,0,136,0.35)', pointRadius:5 },
        { type:'line', data:trend, borderColor:'#C9A34E', borderDash:[4,4], borderWidth:2, pointRadius:0, fill:false }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: {
        x: { title:{display:true,text:'Task Points'}, min:0, max:650 },
        y: { title:{display:true,text:'Total Package Sold'}, min:0, ticks:{ precision:0 } }
      },
      plugins: { legend:{display:false} }
    }
  });
}

/* ============================= DASHBOARD HELPERS ============================= */
function countAllTaskUnits(){
  let total=0, done=0;
  Object.keys(TASKS).forEach(cat=>{
    TASKS[cat].forEach(t=>{
      if(!t.live) return;
      total++;
    });
  });
  return total;
}
function countDoneTaskUnits(student){
  let done=0;
  Object.keys(TASKS).forEach(cat=>{
    TASKS[cat].forEach(t=>{
      if(!t.live) return;
      if(t.submitType==='quiz'){ const at=student.quizAttempts[t.id]; if(at && at.completed) done++; return; }
      if(t.submitType==='sequential'){ const steps=student.sequentialProgress[t.id]; if(steps && t.steps.every((s,i)=>steps[i]&&taskStatusOf(steps[i])==='approved')) done++; return; }
      if(t.submitType==='repeatable'){ if(isTaskFullyDone(student,t)) done++; return; }
      if(taskStatusOf(student.taskStatus[t.id])==='approved') done++;
    });
  });
  return done;
}
function findNextAction(student, pts){
  for(const cat of CATEGORIES){
    if(!categoryUnlocked(cat, student)) continue;
    const tasks = (TASKS[cat.key]||[]).filter(t=>t.live);
    for(const t of tasks){
      if(t.dependsOn){ const dep = findTask(t.dependsOn); if(dep && !isTaskFullyDone(student, dep)) continue; }
      if(t.submitType==='quiz'){ const at=student.quizAttempts[t.id]; if(!at || !at.completed) return { task:t, label:t.nameEN }; continue; }
      if(t.submitType==='repeatable'){ if(!isTaskFullyDone(student,t)) return { task:t, label:t.nameEN }; continue; }
      if(t.submitType==='sequential'){
        const steps = getSeqSteps(student, t.id, t);
        const idx = steps.findIndex(s=>taskStatusOf(s)!=='approved');
        if(idx!==-1 && taskStatusOf(steps[idx])!=='pending') return { task:t, label:`${t.nameEN} \u2014 ${t.steps[idx].title}` };
        continue;
      }
      const status = taskStatusOf(student.taskStatus[t.id]);
      if(status==='not_submitted') return { task:t, label:t.nameEN };
    }
  }
  return null;
}

    TASKS[cat].forEach(t=>{
      if(!t.live || t.submitType==='quiz') return;
      if(t.submitType==='sequential'){
        const steps = s.sequentialProgress[t.id];
        if(!steps) return;
        t.steps.forEach((step,i)=>{ if(taskStatusOf(steps[i])!=='not_submitted') rows.push({ task:t, label:`${t.nameEN} \u2014 ${step.title}`, entry:steps[i], catKey:cat }); });
        return;
      }
      if(t.submitType==='repeatable'){
        const log = s.repeatableLog[t.id];
        if(!log) return;
        log.forEach(entry=>{ rows.push({ task:t, label:t.nameEN, entry:{status:entry.status, content:entry.note}, catKey:cat }); });
        return;
      }
      const entry = s.taskStatus[t.id];
      if(taskStatusOf(entry)!=='not_submitted') rows.push({ task:t, label:t.nameEN, entry, catKey:cat });
    });
  });
  rows.sort((a,b)=>{
    const order = {rejected:0, pending:1, approved:2};
    return (order[taskStatusOf(a.entry)]??3) - (order[taskStatusOf(b.entry)]??3);
  });
  let html = `<button class="back-link" data-back-to-folders>\u2190 Back to My Task</button>
  <div class="section-title"><span class="eyebrow">Everything you've submitted</span>All My Submissions</div>`;
  if(!rows.length) return html + `<div class="empty-state card"><div class="ic">\ud83d\udcc4</div><p>Nothing submitted yet.</p></div>`;
  html += rows.map(r=>{
    const status = taskStatusOf(r.entry);
    const badgeMap = { approved:['approved','\u2705 Approved'], pending:['pending','\u23f3 Pending'], rejected:['rejected','\u21a9\ufe0e Rejected'] };
    const [cls,label] = badgeMap[status] || ['muted','\u2014'];
    return `<div class="task-card ${status==='rejected'?'flagged':''}">
      <div class="task-card-top"><h4>${escapeHtml(r.label)}</h4><span class="badge ${cls}">${label}</span></div>
      <div class="hint" style="margin-bottom:0;">${escapeHtml(CATEGORIES.find(c=>c.key===r.catKey).label)}</div>
      ${renderContentPreview(taskContentOf(r.entry))}
      ${status==='rejected' && taskReasonOf(r.entry) ? `<div class="reject-note"><b>Mentor's note</b>${escapeHtml(taskReasonOf(r.entry))}</div>`:''}
    </div>`;
  }).join('');
  return html;
}

function computeContentStats(entries){
  const withRates = entries.map(e=>{
    const eng = e.views ? (e.likes+e.comments+e.shares+e.saves)/e.views*100 : 0;
    const saveRate = e.views ? e.saves/e.views*100 : 0;
    const shareRate = e.views ? e.shares/e.views*100 : 0;
    return Object.assign({}, e, { eng, saveRate, shareRate });
  });
  const totals = withRates.reduce((a,e)=>({ views:a.views+e.views, likes:a.likes+e.likes, comments:a.comments+e.comments, shares:a.shares+e.shares, saves:a.saves+e.saves }), {views:0,likes:0,comments:0,shares:0,saves:0});
  const totalEng = totals.views ? (totals.likes+totals.comments+totals.shares+totals.saves)/totals.views*100 : 0;
  const totalSaveRate = totals.views ? totals.saves/totals.views*100 : 0;
  const totalShareRate = totals.views ? totals.shares/totals.views*100 : 0;
  const top = withRates.length ? withRates.slice().sort((a,b)=>b.eng-a.eng)[0] : null;
  return { entries: withRates, totals, totalEng, totalSaveRate, totalShareRate, top };
}

function renderSequentialCard(s, t){
  const steps = getSeqSteps(s, t.id, t);
  const earned = seqEarnedPoints(s, t);
  const totalPts = t.steps.reduce((a,x)=>a+x.points,0);
  let html = `<div class="task-card">
    <div class="task-card-top"><h4>${escapeHtml(t.nameEN)} <span class="badge quiz" style="margin-left:4px;">\ud83d\udcc5 Multi-day</span></h4><span class="task-pts">${earned}/${totalPts}pt</span></div>
    <div class="task-desc">${escapeHtml(t.instructions)}</div>`;
  t.steps.forEach((step,i)=>{
    const entry = steps[i];
    const status = taskStatusOf(entry);
    const priorApproved = i===0 || taskStatusOf(steps[i-1])==='approved';
    const locked = !priorApproved;
    const badgeMap = { approved:['approved','\u2705 Approved'], pending:['pending','\u23f3 Pending'], rejected:['rejected','\u21a9\ufe0e Rejected'], not_submitted:['muted','Not submitted'] };
    const [cls,label] = badgeMap[status];
    html += `<div class="seq-step ${locked?'locked':''}">
      <div class="ss-top"><span class="ss-title">${locked?'\ud83d\udd12 ':''}${escapeHtml(step.title)}</span>${ptBadge(step.points)}</div>
      <div class="ss-desc">${escapeHtml(step.instructions)}</div>
      ${locked ? `<span class="badge muted">Locked</span>` : `<div class="flex-between"><span class="badge ${cls}">${label}</span>${(status==='not_submitted'||status==='rejected') ? `<button class="btn btn-ghost btn-sm" data-submit-seq="${t.id}|${i}">${status==='rejected'?'Resubmit':'Submit'}</button>`:''}</div>`}
      ${status==='rejected' && taskReasonOf(entry) ? `<div class="reject-note"><b>Mentor's note</b>${escapeHtml(taskReasonOf(entry))}</div>`:''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderTeamRaceCard(s){
  const ranks = teamRanking();
  const TRACK_STEPS = 8;
  const stepSize = Math.max(1, state.raceStepRatio || 1);
  function scorePct(score){ return Math.min(100, Math.round((score / (TRACK_STEPS * stepSize)) * 100)); }
  function raceLane(teamKey){
    const t = TEAMS[teamKey];
    const rankRow = ranks.find(r=>r.key===teamKey);
    const pct = scorePct(rankRow.score);
    return `<div class="race-lane">
      <div class="rl-label"><div class="tn" style="color:${teamKey==='red'?'var(--red)':teamKey==='yellow'?'#A46B15':'var(--black)'}">${t.name.replace('Team ','')}</div><div class="ts">${rankRow.score} score</div></div>
      <div class="race-track-lane">
        <div class="race-track-line"></div>
        <div class="race-track-stones">${Array.from({length:8}).map(()=>'<span></span>').join('')}</div>
        <div class="race-token ${t.dotClass}" style="left:${pct}%;">${initials(t.name.replace('Team ',''))}</div>
        <div class="race-flag">\ud83c\udff3\ufe0f</div>
      </div>
    </div>`;
  }
  const myRankRow = ranks.find(r=>r.key===s.team);
  const leaderRow = ranks.find(r=>r.rank===1);
  let chaseHint = '';
  if(state.reverseChaseReminder && myRankRow.rank!==1){
    const gap = leaderRow.score - myRankRow.score;
    chaseHint = `<div class="race-chase-hint">\ud83d\udd25 Your team is only <b>${gap} score</b> away from taking the lead!</div>`;
  }
  return `<div class="card">
    ${raceLane('red')}${raceLane('yellow')}${raceLane('black')}
    ${chaseHint}
  </div>`;
}

/* ============================= VIEW: ADMIN REVIEW ============================= */
function pendingTaskSubs(){
  const rows = [];
  state.students.forEach(s=>{
    Object.keys(TASKS).forEach(cat=>{
      TASKS[cat].forEach(t=>{
        if(!t.live) return;
        if(t.submitType==='quiz' || t.submitType==='auto') return;
        if(t.submitType==='sequential'){
          const steps = s.sequentialProgress[t.id];
          if(!steps) return;
          t.steps.forEach((step,i)=>{ if(taskStatusOf(steps[i])==='pending') rows.push({ student:s, task:t, cat, seqIndex:i, seqStep:step }); });
          return;
        }
        if(t.submitType==='repeatable'){
          const log = s.repeatableLog[t.id];
          if(!log) return;
          log.forEach((entry,i)=>{ if(entry.status==='pending') rows.push({ student:s, task:t, cat, repeatIndex:i, repeatEntry:entry }); });
          return;
        }
        const entry = s.taskStatus[t.id];
        if(taskStatusOf(entry)==='pending') rows.push({ student:s, task:t, cat });
      });
    });
  });
  return rows;
}
function pendingInvoiceSubs(){
  const rows = [];
  state.students.forEach(s=>{ s.invoices.forEach(i=>{ if(i.status==='pending') rows.push({ student:s, invoice:i }); }); });
  return rows;
}
function pendingIntentSubs(){
  const rows = [];
  state.students.forEach(s=>{ s.intentProspects.forEach(p=>{ if(p.status==='pending') rows.push({ student:s, intent:p }); }); });
  return rows;
}
function allQuizResults(){
  const rows = [];
  state.students.forEach(s=>{
    Object.keys(s.quizAttempts).forEach(qid=>{
      const at = s.quizAttempts[qid];
      const found = findTask(qid);
      if(found) rows.push({ student:s, task:found, attempt:at });
    });
  });
  return rows;
}

/* ============================= VIEW: MENTOR ============================= */
function allStandardTaskSubmissions(){
  const rows = [];
  state.students.forEach(s=>{
    Object.keys(TASKS).forEach(cat=>{
      TASKS[cat].forEach(t=>{
        if(!t.live) return;
        if(['quiz','sequential','repeatable'].includes(t.submitType)) return;
        const entry = s.taskStatus[t.id];
        const status = taskStatusOf(entry);
        if(status==='not_submitted') return;
        rows.push({ student:s, task:t, cat, entry, status });
      });
    });
  });
  return rows;
}

function handleLoginUnified(){
  const val = document.getElementById('login-member-id').value.trim();
  const errEl = document.getElementById('login-error');
  if(!val){ errEl.textContent = 'Please enter your Member ID.'; return; }
  const student = state.students.find(s=>s.memberId.toLowerCase()===val.toLowerCase());
  if(student){ completeLogin({ authRole:'student', authName:student.name, role:'student', currentStudentId:student.id }); return; }
  const matchedMentor = MENTORS.find(m=>m.toLowerCase()===val.toLowerCase());
  if(matchedMentor){
    state.loginPendingRole = ADMIN_NAMES.includes(matchedMentor) ? 'admin' : 'mentor';
    state.loginPendingName = matchedMentor;
    render();
    return;
  }
  errEl.textContent = 'Member ID not found. Please check and try again.';
}
function handleLoginAccessCode(){
  const code = document.getElementById('login-access-code').value.trim().toUpperCase();
  const errEl = document.getElementById('login-error');
  if(code !== STAFF_ACCESS_CODE){ errEl.textContent = 'Access code is incorrect.'; return; }
  const role = state.loginPendingRole, name = state.loginPendingName;
  state.loginPendingRole = null; state.loginPendingName = '';
  completeLogin({ authRole:role, authName:name, role, currentStudentId: state.currentStudentId });
}
function handleLoginCancelPending(){
  state.loginPendingRole = null; state.loginPendingName = '';
  render();
}
function completeLogin(session){
  state.isAuthenticated = true;
  state.authRole = session.authRole;
  state.authName = session.authName;
  state.role = session.role;
  if(session.currentStudentId) state.currentStudentId = session.currentStudentId;
  try{ localStorage.setItem('el002_session', JSON.stringify({ authRole:state.authRole, authName:state.authName, role:state.role, currentStudentId:state.currentStudentId })); }catch(e){}
  render();
}
function handleLogout(){
  state.isAuthenticated = false;
  state.authRole = null;
  state.authName = '';
  try{ localStorage.removeItem('el002_session'); }catch(e){}
  render();
}
function restoreSession(){
  try{
    const raw = localStorage.getItem('el002_session');
    if(!raw) return;
    const s = JSON.parse(raw);
    if(!s || !s.authRole) return;
    // Guard against a stale session pointing at a student that no longer exists
    // (e.g. real Supabase data replacing the old demo roster) — log out cleanly instead of crashing.
    if(s.currentStudentId && !state.students.some(stu=>stu.id===s.currentStudentId)){
      localStorage.removeItem('el002_session');
      return;
    }
    state.isAuthenticated = true;
    state.authRole = s.authRole;
    state.authName = s.authName;
    state.role = s.role;
    if(s.currentStudentId) state.currentStudentId = s.currentStudentId;
  }catch(e){}
}

    let dataAttr, dataAttrReject, dataAttrDelete, metaExtra, ptsShown, contentHtml, remarksTxt;
    if(isSeq){
      dataAttr = `data-approve-seq="${r.student.id}|${r.task.id}|${r.seqIndex}"`; dataAttrReject = `data-reject-seq="${r.student.id}|${r.task.id}|${r.seqIndex}"`; dataAttrDelete = `data-delete-seq="${r.student.id}|${r.task.id}|${r.seqIndex}"`;
      metaExtra = ` \u2014 ${escapeHtml(r.seqStep.title)}`; ptsShown = r.seqStep.points;
      contentHtml = renderContentPreview(taskContentOf(r.student.sequentialProgress[r.task.id][r.seqIndex])); remarksTxt = '';
    } else if(isRepeat){
      dataAttr = `data-approve-repeat="${r.student.id}|${r.task.id}|${r.repeatIndex}"`; dataAttrReject = `data-reject-repeat="${r.student.id}|${r.task.id}|${r.repeatIndex}"`; dataAttrDelete = `data-delete-repeat="${r.student.id}|${r.task.id}|${r.repeatIndex}"`;
      metaExtra = ` \u2014 logged ${r.repeatEntry.date}`; ptsShown = r.task.points;
      contentHtml = renderContentPreview(r.repeatEntry.note); remarksTxt = '';
    } else {
      dataAttr = `data-approve-task="${r.student.id}|${r.task.id}"`; dataAttrReject = `data-reject-task="${r.student.id}|${r.task.id}"`; dataAttrDelete = `data-delete-task-sub="${r.student.id}|${r.task.id}"`;
      metaExtra = ''; ptsShown = r.task.points;
      const entry = r.student.taskStatus[r.task.id];
      contentHtml = renderContentPreview(taskContentOf(entry)); remarksTxt = taskRemarksOf(entry);
    }
    return `
    <div class="review-item">
      <div class="ri-top">${avatarHtml(r.student,34)}<div><div class="ri-name">${escapeHtml(r.student.name)} <span class="badge ${TEAMS[r.student.team].badgeClass}" style="margin-left:4px;">${TEAMS[r.student.team].name.replace('Team ','')}</span></div><div class="ri-meta">${escapeHtml(CATEGORIES.find(c=>c.key===r.cat).label)} \u00b7 ${escapeHtml(r.task.nameEN)}${metaExtra} \u00b7 +${ptsShown}pt \u00b7 Mentor: ${escapeHtml(r.task.mentor||'\u2014')}</div></div></div>
      ${contentHtml}
      ${remarksTxt ? `<div class="remarks-note"><b>Student's remarks</b>${escapeHtml(remarksTxt)}</div>` : ''}
      <div class="review-actions">
        <button class="btn btn-success btn-sm" ${dataAttr}>\u2713 Approve</button>
        <button class="btn btn-danger btn-sm" ${dataAttrReject}>\u2715 Reject</button>
        <button class="btn btn-outline btn-sm" ${dataAttrDelete}>\ud83d\uddd1 Delete</button>
      </div>
    </div>`;
  }).join('');
}

function blankTaskDraft(){
  return { id:'', nameEN:'', nameCN:'', category:CATEGORIES[0].key, points:10, mentor:MENTORS[0], deadline:'', instructions:'', submitType:'photo', remarks:'none', remarksHint:'', autoAnswer:[''], quiz:{ perQuestion:5, questions:[] }, fields:[], steps:[], weeklyCap:1, dependsOn:'', live:false, tier:'', _isNew:true };
}
function openTaskEditor(taskId){
  const existing = taskId ? findTask(taskId) : null;
  window.__taskDraft = existing ? JSON.parse(JSON.stringify(Object.assign({_isNew:false}, existing))) : blankTaskDraft();
  const d = window.__taskDraft;
  if(d.submitType==='auto' && !d.autoAnswer) d.autoAnswer = [''];
  if(d.submitType==='quiz' && !d.quiz) d.quiz = { perQuestion:5, questions:[] };
  if(d.submitType==='structured' && !d.fields) d.fields = [];
  if(d.submitType==='sequential' && !d.steps) d.steps = [];
  renderTaskEditorModal();
}

function bindTaskEditorEvents(){
  const d = window.__taskDraft;
  const byId = id=>document.getElementById(id);
  ['tf-id','tf-nameEN','tf-nameCN','tf-instructions','tf-mentor','tf-deadline'].forEach(fid=>{
    const el = byId(fid); if(!el) return;
    el.addEventListener('input', ()=>{
      const key = { 'tf-id':'id','tf-nameEN':'nameEN','tf-nameCN':'nameCN','tf-instructions':'instructions','tf-mentor':'mentor','tf-deadline':'deadline' }[fid];
      d[key] = el.value;
    });
  });
  const pointsEl = byId('tf-points'); if(pointsEl) pointsEl.addEventListener('input', ()=>{ d.points = parseInt(pointsEl.value,10)||0; });
  const tierEl = byId('tf-tier'); if(tierEl) tierEl.addEventListener('change', ()=>{
    d.tier = tierEl.value;
    if(d.tier && TASK_TIER_RANGES[d.tier]){ d.points = Math.round((TASK_TIER_RANGES[d.tier][0]+TASK_TIER_RANGES[d.tier][1])/2); renderTaskEditorModal(); }
  });
  const liveEl = byId('tf-live'); if(liveEl) liveEl.addEventListener('change', ()=>{ d.live = liveEl.checked; });
  const catEl = byId('tf-category'); if(catEl) catEl.addEventListener('change', ()=>{ d.category = catEl.value; });
  const remarksEl = byId('tf-remarks'); if(remarksEl) remarksEl.addEventListener('change', ()=>{ d.remarks = remarksEl.value; renderTaskEditorModal(); });
  const remarksHintEl = byId('tf-remarksHint'); if(remarksHintEl) remarksHintEl.addEventListener('input', ()=>{ d.remarksHint = remarksHintEl.value; });
  const typeEl = byId('tf-submitType'); if(typeEl) typeEl.addEventListener('change', ()=>{
    d.submitType = typeEl.value;
    if(d.submitType==='auto' && !d.autoAnswer) d.autoAnswer=[''];
    if(d.submitType==='quiz' && !d.quiz) d.quiz={ perQuestion:5, questions:[] };
    if(d.submitType==='structured' && !d.fields) d.fields=[];
    if(d.submitType==='sequential' && !d.steps) d.steps=[];
    renderTaskEditorModal();
  });

  const newAnsEl = byId('tf-new-answer');
  const addAnsBtn = document.querySelector('[data-add-answer]');
  if(addAnsBtn) addAnsBtn.addEventListener('click', ()=>{ const val=newAnsEl.value.trim(); if(!val) return; d.autoAnswer=d.autoAnswer.filter(a=>a); d.autoAnswer.push(val); renderTaskEditorModal(); });
  document.querySelectorAll('[data-remove-answer]').forEach(btn=>btn.addEventListener('click', ()=>{ d.autoAnswer.splice(parseInt(btn.dataset.removeAnswer,10),1); renderTaskEditorModal(); }));

  const perqEl = byId('tf-quiz-perq'); if(perqEl) perqEl.addEventListener('input', ()=>{ d.quiz.perQuestion = parseInt(perqEl.value,10)||1; });
  document.querySelectorAll('[data-q-text]').forEach(el=>el.addEventListener('input', ()=>{ d.quiz.questions[parseInt(el.dataset.qText,10)].text = el.value; }));
  document.querySelectorAll('[data-q-opt]').forEach(el=>el.addEventListener('input', ()=>{ const [qi,oi]=el.dataset.qOpt.split('|').map(Number); d.quiz.questions[qi].options[oi]=el.value; }));
  document.querySelectorAll('[data-q-correct]').forEach(el=>el.addEventListener('change', ()=>{ const [qi,oi]=el.dataset.qCorrect.split('|').map(Number); d.quiz.questions[qi].correct=oi; }));
  const addQBtn = document.querySelector('[data-add-question]'); if(addQBtn) addQBtn.addEventListener('click', ()=>{ d.quiz.questions.push({ text:'', options:['','','',''], correct:0 }); renderTaskEditorModal(); });
  document.querySelectorAll('[data-remove-question]').forEach(btn=>btn.addEventListener('click', ()=>{ d.quiz.questions.splice(parseInt(btn.dataset.removeQuestion,10),1); renderTaskEditorModal(); }));

  document.querySelectorAll('[data-f-label]').forEach(el=>el.addEventListener('input', ()=>{ d.fields[parseInt(el.dataset.fLabel,10)].label = el.value; }));
  document.querySelectorAll('[data-f-hint]').forEach(el=>el.addEventListener('input', ()=>{ d.fields[parseInt(el.dataset.fHint,10)].hint = el.value; }));
  const addFieldBtn = document.querySelector('[data-add-field]'); if(addFieldBtn) addFieldBtn.addEventListener('click', ()=>{ d.fields.push({ id:'f'+Date.now(), label:'', hint:'' }); renderTaskEditorModal(); });
  const promptEnabledEl = byId('tf-prompt-enabled'); if(promptEnabledEl) promptEnabledEl.addEventListener('change', ()=>{ d.promptTemplate = promptEnabledEl.checked ? (d.promptTemplate || '') : undefined; renderTaskEditorModal(); });
  const promptTemplateEl = byId('tf-prompt-template'); if(promptTemplateEl) promptTemplateEl.addEventListener('input', ()=>{ d.promptTemplate = promptTemplateEl.value; });
  document.querySelectorAll('[data-remove-field]').forEach(btn=>btn.addEventListener('click', ()=>{ d.fields.splice(parseInt(btn.dataset.removeField,10),1); renderTaskEditorModal(); }));

  document.querySelectorAll('[data-st-title]').forEach(el=>el.addEventListener('input', ()=>{ d.steps[parseInt(el.dataset.stTitle,10)].title = el.value; }));
  document.querySelectorAll('[data-st-instructions]').forEach(el=>el.addEventListener('input', ()=>{ d.steps[parseInt(el.dataset.stInstructions,10)].instructions = el.value; }));
  document.querySelectorAll('[data-st-points]').forEach(el=>el.addEventListener('input', ()=>{ d.steps[parseInt(el.dataset.stPoints,10)].points = parseInt(el.value,10)||0; }));
  document.querySelectorAll('[data-st-type]').forEach(el=>el.addEventListener('change', ()=>{ d.steps[parseInt(el.dataset.stType,10)].submitType = el.value; }));
  const addStepBtn = document.querySelector('[data-add-step]'); if(addStepBtn) addStepBtn.addEventListener('click', ()=>{ d.steps.push({ id:'st'+Date.now(), title:'', instructions:'', points:5, submitType:'photo' }); renderTaskEditorModal(); });
  document.querySelectorAll('[data-remove-step]').forEach(btn=>btn.addEventListener('click', ()=>{ d.steps.splice(parseInt(btn.dataset.removeStep,10),1); renderTaskEditorModal(); }));

  const weeklyCapEl = byId('tf-weekly-cap'); if(weeklyCapEl) weeklyCapEl.addEventListener('input', ()=>{ d.weeklyCap = parseInt(weeklyCapEl.value,10)||1; });
  const dependsOnEl = byId('tf-depends-on'); if(dependsOnEl) dependsOnEl.addEventListener('change', ()=>{ d.dependsOn = dependsOnEl.value; });

  const saveBtn = byId('tf-save'); if(saveBtn) saveBtn.addEventListener('click', saveTaskDraft);
}
function saveTaskDraft(){
  const d = window.__taskDraft;
  if(!d.id.trim() || !d.nameEN.trim()){ toast('Task ID and Name (EN) are required'); return; }
  if(!d.mentor){ toast('Please assign a Mentor'); return; }
  if(d.submitType==='auto') d.autoAnswer = d.autoAnswer.filter(a=>a && a.trim());
  if(!d._isNew){ Object.keys(TASKS).forEach(catKey=>{ TASKS[catKey] = TASKS[catKey].filter(t=>t.id !== d.id); }); }
  else { const dupe = findTask(d.id); if(dupe){ toast('This Task ID already exists'); return; } }
  const clean = Object.assign({}, d); delete clean._isNew;
  if(!TASKS[clean.category]) TASKS[clean.category] = [];
  TASKS[clean.category].push(clean);
  closeModal();
  render();
  toast(d._isNew ? 'Task added' : 'Task updated');
  syncUpsertTaskDef(clean, TASKS[clean.category].length - 1);
}
function deleteTask(taskId){
  if(!window.confirm('Delete this task? This cannot be undone.')) return;
  Object.keys(TASKS).forEach(catKey=>{ TASKS[catKey] = TASKS[catKey].filter(t=>t.id !== taskId); });
  render();
  toast('Task deleted');
  syncDeleteTaskDef(taskId);
}
function toggleTaskLive(taskId){ const t = findTask(taskId); if(!t) return; t.live = !t.live; render(); toast(t.live ? 'Task published' : 'Task unpublished'); syncUpsertTaskDef(t); }
function moveTask(taskId, dir){
  const t = findTask(taskId); if(!t) return;
  const arr = TASKS[t.category];
  const idx = arr.findIndex(x=>x.id===taskId);
  const swapWith = dir==='up' ? idx-1 : idx+1;
  if(swapWith<0 || swapWith>=arr.length) return;
  [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
  render();
  syncTasksOrder(t.category);
}

function openRewardEditorModal(rid){

  const draft = existing ? { ...existing } : { id:'rw'+Date.now(), title:'', sub:'', threshold:0, icon:'\ud83c\udf81' };
  openModal(`

  `);
  document.getElementById('rw-save-btn').addEventListener('click', ()=>{
    const title = document.getElementById('rw-title').value.trim();

    const icon = document.getElementById('rw-icon').value.trim() || '\ud83c\udf81';
    const threshold = parseInt(document.getElementById('rw-threshold').value,10)||0;
    const sub = document.getElementById('rw-sub').value.trim();
    if(existing){
      existing.title = title; existing.icon = icon; existing.threshold = threshold; existing.sub = sub;

    }
    closeModal(); render();

function blankClassDraft(){ return { id:'cl'+Date.now(), category:'none', title:'', mentor:'', datetime:'', zoomLink:'', zoomExpiry:'', replayLink:'', unlockAt:0, _isNew:true }; }
function openClassEditor(classId){

  `);

  byId('cf-mentor').addEventListener('input', e=>{ d.mentor = e.target.value; });
  byId('cf-datetime').addEventListener('input', e=>{ d.datetime = e.target.value; });
  byId('cf-zoom').addEventListener('input', e=>{ d.zoomLink = e.target.value; });
  byId('cf-zoomexpiry').addEventListener('input', e=>{ d.zoomExpiry = e.target.value; });
  byId('cf-replay').addEventListener('input', e=>{ d.replayLink = e.target.value; });
  byId('cf-save').addEventListener('click', saveClassDraft);

function saveClassDraft(){
  const d = window.__classDraft;
  if(!d.title.trim()){ toast('Class title is required'); return; }
  const clean = Object.assign({}, d); delete clean._isNew;
  if(!d._isNew){ const idx = CLASSES.findIndex(c=>c.id===d.id); if(idx!==-1) CLASSES[idx] = clean; }
  else CLASSES.push(clean);
  closeModal(); render(); toast(d._isNew ? 'Class added' : 'Class updated');
}
function deleteClass(classId){ if(!window.confirm('Delete this class?')) return; CLASSES = CLASSES.filter(c=>c.id!==classId); render(); toast('Class deleted'); }

document.addEventListener('input', (e)=>{
  if(e.target.id === 'tg-template') state.tgTemplate = e.target.value;
  if(e.target.id === 'lookup-search-input'){ state.lookupSearchQuery = e.target.value; state.lookupHighlightIndex = 0; render(); const el = document.getElementById('lookup-search-input'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  if(e.target.id === 'member-search-input'){ state.memberSearchQuery = e.target.value; render(); const el = document.getElementById('member-search-input'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
});
document.addEventListener('keydown', (e)=>{
  if(e.target.id === 'login-member-id' && e.key === 'Enter'){ e.preventDefault(); handleLoginUnified(); return; }
  if(e.target.id === 'login-access-code' && e.key === 'Enter'){ e.preventDefault(); handleLoginAccessCode(); return; }
  if(e.target.id !== 'lookup-search-input') return;
  const matches = window.__lookupMatches || [];
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(matches.length){ state.lookupHighlightIndex = Math.min(matches.length-1, state.lookupHighlightIndex+1); render(); focusLookupInput(); }
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(matches.length){ state.lookupHighlightIndex = Math.max(0, state.lookupHighlightIndex-1); render(); focusLookupInput(); }
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(matches.length && matches[state.lookupHighlightIndex]){
      state.mentorViewingStudentId = matches[state.lookupHighlightIndex].id;
      state.currentStudentId = state.mentorViewingStudentId;
      state.lookupSearchQuery = ''; state.lookupHighlightIndex = 0;
      render();
    }
  } else if(e.key === 'Escape'){
    state.lookupSearchQuery = ''; state.lookupHighlightIndex = 0;
    render(); focusLookupInput();
  }
});
function focusLookupInput(){
  const el = document.getElementById('lookup-search-input');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function renderAvatarPickerModal(){
  const tab = window.__avatarModalTab;
  const s = currentStudent();
  openModal(`
    <div class="modal-title">Update Your Photo</div>
    <div class="segment">
      <button class="${tab==='upload'?'active':''}" data-avatar-modal-tab="upload">Upload Photo</button>
      <button class="${tab==='preset'?'active':''}" data-avatar-modal-tab="preset">Choose Avatar</button>
    </div>
    ${tab==='upload'
      ? `<div class="field"><label class="field-label">Choose a photo from your device</label><input type="file" accept="image/*" id="avatar-modal-file-input"></div>
         <p class="hint">A clear, professional headshot works best \u2014 it will show up on the leaderboard and your celebration cards.</p>`
      : (AVATAR_GALLERY.length
          ? `<div class="avatar-picker-grid">${AVATAR_GALLERY.map(a=>`<button data-select-gallery-avatar="${a.id}" class="${s.avatarDataUrl===a.url?'selected':''}"><img src="${a.url}" alt=""></button>`).join('')}</div>`
          : `<div class="empty-state"><div class="ic">\ud83d\uddbc\ufe0f</div><p>No avatars available yet \u2014 check back soon.</p></div>`)}
  `);
  const fileInput = document.getElementById('avatar-modal-file-input');
  if(fileInput) fileInput.addEventListener('change', e=>handleAvatarUpload(e.target.files[0]));
}
function handleSelectGalleryAvatar(id){
  const a = AVATAR_GALLERY.find(x=>x.id===id);
  if(!a) return;
  applyNewAvatar(a.url, 'Avatar updated!');
}
function handleAvatarUpload(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    applyNewAvatar(ev.target.result, 'Photo uploaded!');
  };
  reader.readAsDataURL(file);
}
function applyNewAvatar(url, freshMsg){
  const s = currentStudent();
  s.avatarDataUrl = url;
  let msg = 'Photo updated';
  if(!s.avatarBonusClaimed){ s.avatarBonusClaimed = true; msg = `${freshMsg} +${AVATAR_BONUS_PT}pt one-time bonus`; }
  closeModal();
  render();
  toast(msg);
}
function handlePosterUpload(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{ state.timelinePosterUrl = ev.target.result; toast('Timeline poster updated'); };
  reader.readAsDataURL(file);
}

function handleAvatarGalleryUpload(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      AVATAR_GALLERY.push({ id:'ag-'+Math.random().toString(36).slice(2,8), url: ev.target.result });
      remaining--;
      if(remaining===0){ render(); toast(`${files.length} avatar${files.length===1?'':'s'} added to the gallery`); }
    };
    reader.readAsDataURL(file);
  });
}
function handleDeleteAvatarGalleryImage(id){
  const img = AVATAR_GALLERY.find(a=>a.id===id);
  if(!img) return;
  if(!window.confirm('Remove this avatar? Anyone currently using it will revert to their initials.')) return;
  AVATAR_GALLERY = AVATAR_GALLERY.filter(a=>a.id!==id);
  state.students.forEach(s=>{ if(s.avatarDataUrl===img.url) s.avatarDataUrl = null; });
  render();
  toast('Avatar removed');
}
function handleRemoveAvatar(sid){ const s = getStudent(sid); s.avatarDataUrl = null; render(); toast(`Removed ${s.name}'s photo (points unaffected)`); }
function handleSaveCard(tier){
  CARD_TEMPLATES[tier] = { en: document.getElementById('card-en').value, zh: document.getElementById('card-zh').value, tw: document.getElementById('card-tw').value };
  toast(`Saved celebration copy for ${tier}`);
}
function openAddTierModal(){
  openModal(`
    <div class="modal-title">Add New Tier</div>
    <div class="field"><label class="field-label">Tier Name</label><input type="text" id="nt-name" placeholder="e.g. DIAMOND ELITE"></div>
    <div class="field"><label class="field-label">Celebration copy (English) <span class="req">*required</span></label><textarea id="nt-en" placeholder="Use {{name}} and {{tier}}"></textarea></div>
    <div class="field"><label class="field-label">Simplified Chinese (optional, can add later)</label><textarea id="nt-zh"></textarea></div>
    <div class="field"><label class="field-label">Traditional Chinese (optional, can add later)</label><textarea id="nt-tw"></textarea></div>
    <button class="btn btn-primary btn-block" id="nt-save">Add Tier</button>
  `);
  document.getElementById('nt-save').addEventListener('click', ()=>{
    const name = document.getElementById('nt-name').value.trim();
    const en = document.getElementById('nt-en').value.trim();
    if(!name || !en){ toast('Tier name and English copy are required'); return; }
    if(TIERS.includes(name)){ toast('This tier already exists'); return; }
    TIERS.push(name);
    CARD_TEMPLATES[name] = { en, zh: document.getElementById('nt-zh').value.trim(), tw: document.getElementById('nt-tw').value.trim() };
    state.currentCardTier = name;
    closeModal(); render(); toast(`Tier "${name}" added`);
  });
}
function handleAddMember(){
  const name = document.getElementById('am-name').value.trim();
  const id = document.getElementById('am-id').value.trim();
  const originTeam = document.getElementById('am-origin-team').value;
  const team = mapOriginTeamToColor(originTeam);

async function collectCustomFieldValues(fields, idPrefix){
  const result = {};
  for(const f of fields){

    }
  }

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',').map(c=>c.trim());
    const row = {};
    headers.forEach((h,i)=>{ row[h] = cells[i] || ''; });
    return row;
  });
}

async function handleDownloadCard(invoiceId){
  const s = currentStudent();
  const inv = s.invoices.find(i=>i.id===invoiceId);
  if(!inv) return;
  const tpl = (CARD_TEMPLATES[inv.tier] && CARD_TEMPLATES[inv.tier][state.celebrateLang||'en']) || '';
  const msg = fillTemplate(tpl, s, inv.tier);
  const canvas = document.createElement('canvas');
  canvas.width = 720; canvas.height = 900;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,720,900);
  ctx.fillStyle = '#C9A34E'; ctx.font = '700 20px DM Sans, sans-serif'; ctx.textAlign='center';
  ctx.fillText('EXCELLENT LEADER 002', 360, 90);

  async function drawAvatar(){
    ctx.save();
    ctx.beginPath(); ctx.arc(360,220,90,0,Math.PI*2); ctx.closePath(); ctx.clip();
    if(s.avatarDataUrl){
      await new Promise(res=>{ const img = new Image(); img.crossOrigin='anonymous'; img.onload=()=>{ ctx.drawImage(img,270,130,180,180); res(); }; img.onerror=()=>res(); img.src = s.avatarDataUrl; });
    } else {
      ctx.fillStyle = '#7350B5'; ctx.fillRect(270,130,180,180);
      ctx.fillStyle = '#fff'; ctx.font='700 56px DM Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(initials(s.name),360,240);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(360,220,90,0,Math.PI*2); ctx.lineWidth=6; ctx.strokeStyle='#C9A34E'; ctx.stroke();
  }
  await drawAvatar();

  ctx.fillStyle = '#3A0066'; ctx.font = '700 34px DM Sans, sans-serif'; ctx.textAlign='center';
  ctx.fillText(`Congratulations, ${s.name}!`, 360, 380);
  ctx.fillStyle = '#6B5E82'; ctx.font = '400 20px DM Sans, sans-serif';
  wrapCanvasText(ctx, msg, 360, 430, 560, 28);
  ctx.fillStyle = '#8A6D1F'; ctx.font='700 20px DM Sans, sans-serif';
  ctx.fillText(`+${tierWeight(inv.tier)}pt \u00b7 ${inv.date}`, 360, 560);

  canvas.toBlob(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `EL002-${inv.tier.replace(/\s+/g,'-')}-${inv.date}.png`;
    a.click();
  });
  toast('Card downloaded');
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let curY = y;
  ctx.textAlign = 'center';
  for(let n=0;n<words.length;n++){
    const testLine = line + words[n] + ' ';
    if(ctx.measureText(testLine).width > maxWidth && n>0){
      ctx.fillText(line, x, curY); line = words[n] + ' '; curY += lineHeight;
    } else line = testLine;
  }
  ctx.fillText(line, x, curY);
}

function openTaskSubmitModal(taskId){
  const task = findTask(taskId);
  const isAuto = task.submitType === 'auto';
  const isStructured = task.submitType === 'structured';
  const remarksBlock = task.remarks && task.remarks !== 'none' ? `

  else if(isStructured){
    mainField = task.fields.map((f,fi)=>`<div class="field"><label class="field-label">${escapeHtml(f.label)}</label><textarea id="task-field-${fi}" placeholder="${escapeHtml(f.hint||'')}" ${task.promptTemplate?`oninput="window.__updatePromptPreview && window.__updatePromptPreview()"`:''}></textarea></div>`).join('');
